        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 50px 20px 40px;
            margin-bottom: 40px;
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #7c5cff, #a78bfa);
            border-radius: 3px;
        }

        h1 {
            font-size: 2.6rem;
            background: linear-gradient(90deg, #7c5cff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #a1a1aa;
            font-size: 1.15rem;
            font-weight: 400;
        }

        /* Games Section */
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game {
            background: rgba(26, 26, 40, 0.85);
            border-radius: 16px;
            padding: 28px 30px;
            border: 1px solid rgba(124, 92, 255, 0.15);
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .game:hover {
            transform: translateY(-4px);
            border-color: rgba(124, 92, 255, 0.5);
            box-shadow: 0 12px 30px rgba(124, 92, 255, 0.15);
            background: rgba(30, 30, 48, 0.9);
        }

        .game-info h2 {
            color: #fff;
            font-size: 1.35rem;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .game-info p {
            color: #a1a1aa;
            font-size: 0.95rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #7c5cff, #6a4de0);
            color: white;
            padding: 12px 26px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(124, 92, 255, 0.3);
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #8b6fff, #7c5cff);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 92, 255, 0.45);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 70px;
            padding: 25px 0 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: #71717a;
            font-size: 0.9rem;
        }

        footer a {
            color: #a78bfa;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .game {
                flex-direction: column;
                align-items: flex-start;
                padding: 24px;
            }

            .download-btn {
                width: 100%;
                justify-content: center;
            }
        }

    <div class="container">
        <header>

        <div class="games-list">

            <!-- لعبة 1 -->
            <div class="game" onclick="changeBackground('cars')" style="cursor: pointer;">
                <div class="game-info">
                    <h2>Cars مصر</h2>
                    <p>لعبة سباق سيارات مصرية</p>
                </div>
                <button class="download-btn" onclick="event.stopPropagation(); openCarsLink()" style="width: 100%; justify-content: center;">
                    تحميل اللعبة index.html
                </button>
            </div>

            <!-- لعبة 2 -->
            <div class="game" onclick="changeBackground('neon')" style="cursor: pointer;">
                <div class="game-info">
                    <h2>Neon Racer Pro</h2>
                    <p>سباق نيون سريع وإثارة عالية</p>
                </div>
                <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
                    <button class="download-btn" onclick="event.stopPropagation(); openNeonLink()" style="width: 100%; justify-content: center;">
                        تحميل اللعبة index.html
                    </button>
                    <button class="download-btn" onclick="event.stopPropagation(); openNeonApk()" style="width: 100%; justify-content: center; background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                        تحميل اللعبة apk
                    </button>
                </div>
            </div>

        </div>

        <footer>
            © 2026 — Stohamza Blog for Games
        </footer>
    </div>

    <script>
        function changeBackground(type) {
            // شيل أي خلفية سابقة
            document.body.classList.remove('bg-cars', 'bg-neon');
            // حط الخلفية الجديدة (لو موجودة)
            if (type === 'cars' || type === 'neon') {
                document.body.classList.add('bg-' + type);
            }
        }

        function openCarsLink() {
            changeBackground('cars');
            window.open('https://github.com/stonehamza/cars_-', '_blank');
        }

        function openNeonLink() {
            changeBackground('neon');
            window.open('https://github.com/stonehamza/neon-racer-pro', '_blank');
        }

        function openNeonApk() {
            changeBackground('neon');
            window.open('https://www.mediafire.com/file/gnv9o1mq1ejecig/neon-racer-pro.apk/file', '_blank');
        }
